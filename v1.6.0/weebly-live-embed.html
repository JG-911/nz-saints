 async function update(force=false){
  if(stopped)return;const iso=host.dataset.civilDate;if(!iso){cancelText();return;}
  const year=Number(iso.slice(0,4));if(iso!==renderedDate){cancelText();renderedDate=iso;}
  if(annualCache.has(year)&&!force){annual=annualCache.get(year);render(iso);if(!annual)notice('Prayer focus dates for '+year+' are not yet available.',false);return;}
